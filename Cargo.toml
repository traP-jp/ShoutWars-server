[package]
name = "shoutwars-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "ShoutWars のバックエンド"
license = "MIT"
repository = "https://github.com/traP-jp/ShoutWars-server"

[dependencies]
axum = "0.8.9"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
# デプロイ先 (HTTPS) に対しても同じテストを流せるようにする。
# OpenSSL への依存を避けるため TLS は rustls を使う。
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
# 日本語の doc コメントで固有名詞 (MessagePack、ShoutWars など) に毎回反応するため無効にする。
doc_markdown = "allow"

[profile.release]
# 共用基盤で動かすため、バイナリとメモリを小さく保つ。
lto = true
codegen-units = 1
strip = true
# panic = "abort" は使わない。巻き戻しが無いと、1 タスクの panic がプロセス全体を落とす。
