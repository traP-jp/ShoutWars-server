name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-targets -- -D warnings

  # 実際にサーバーを起動して HTTP で叩くテストが含まれる。締め切りを実時間で待つため、
  # 走らせる並列度を上げると窓を跨いで落ちることがある。既定のまま回す。
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked

  # デプロイはこの Dockerfile で行われる。壊れていればここで止める。
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t shoutwars-server .
      # 起動まで確かめる。構築側と実行側の Debian がずれると glibc が合わず、
      # ビルドは通るのに起動しない。イメージにシェルは無いので外から叩く。
      - name: Run the image
        run: |
          docker run -d --rm --name check -p 7468:7468 -e ROOM_LIMIT=3 shoutwars-server
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:7468/v3/status && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:7468/v3/status
          docker logs check
          docker stop check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-audit
      - run: cargo audit
